services:
  braingpt:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3030
      DATABASE_PATH: /data/braingpt.sqlite
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - braingpt-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 25s
volumes:
  braingpt-data:
